<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Domain view dev</title>
    <style>
      body.dev {
        background: var(--color-background-tertiary, #faf9f5);
        padding: 16px;
      }
      :root[data-theme='dark'] body.dev {
        background: #141413;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) body.dev {
          background: #141413;
        }
      }
      .dev-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        margin-bottom: 16px;
        font: 13px system-ui, sans-serif;
        color: var(--color-text-secondary);
      }
      .dev-frame {
        margin: 0 auto;
        padding: 12px 16px;
        border-radius: 12px;
        background: var(--color-background-primary);
        border: 0.5px solid var(--color-border-tertiary);
      }
      .dev-frame[data-mode='fullscreen'] {
        max-width: none !important;
        min-height: calc(100vh - 80px);
        border-radius: 0;
      }
    </style>
  </head>
  <body class="dev">
    <div class="dev-bar">
      <label>Fixture <select id="fixture"></select></label>
      <label>Theme
        <select id="theme">
          <option value="system">system</option>
          <option value="light">light</option>
          <option value="dark">dark</option>
        </select>
      </label>
      <label>Mode
        <select id="mode">
          <option value="inline">inline</option>
          <option value="fullscreen">fullscreen</option>
        </select>
      </label>
      <label>Width
        <select id="width">
          <option value="720">720px (desktop)</option>
          <option value="360">360px (mobile)</option>
        </select>
      </label>
      <label><input type="checkbox" id="canfs" checked /> host offers full screen</label>
    </div>
    <div class="dev-frame" id="frame"><main id="app"></main></div>
    <script type="module" src="./dev.ts"></script>
  </body>
</html>
